<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Glowing subtle backdrop -->
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Box Icon -->
  <g transform="translate(20, 15)">
    <!-- Base shadow -->
    <ellipse cx="45" cy="80" rx="36" ry="10" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>

    <!-- 3D Isometric Cube -->
    <!-- Top Face -->
    <polygon points="45,10 80,28 45,46 10,28" fill="url(#topFace)" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <polygon points="10,28 45,46 45,82 10,64" fill="url(#boxGrad)" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <polygon points="45,46 80,28 80,64 45,82" fill="url(#rightFace)" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- POS Thermal Slot & Lighting -->
    <path d="M 28 37 L 62 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 32 41 L 58 28" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Sparkle / Check indicator -->
    <circle cx="68" cy="74" r="10" fill="#10b981"/>
    <path d="M 64 74 L 67 77 L 73 71" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: TOP-BOX -->
  <g transform="translate(130, 72)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.03em">
      TOP<tspan fill="#38bdf8">-BOX</tspan>
    </text>
    <text y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="0.25em">
      LOGICIEL DE CAISSE PRO
    </text>
  </g>
</svg>
